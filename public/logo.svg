<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Facet">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <!-- one gradient across the whole stone so the facets read as a single
         cut form catching light, not as separate coloured shards -->
    <linearGradient id="stone" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#shell)"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="#0a0a0e"/>

  <!-- a cut stone: table, crown facets, pavilion. Drawn at 3 weights so it
       still reads at 16px in the nav and favicon. -->
  <g stroke-linejoin="round">
    <!-- table -->
    <path d="M16 7.4 L22.6 12.1 L16 16.4 L9.4 12.1 Z" fill="url(#stone)"/>
    <!-- crown facets -->
    <path d="M9.4 12.1 L16 16.4 L12.2 24.6 L6.9 16.6 Z" fill="#8b5cf6" opacity="0.92"/>
    <path d="M22.6 12.1 L25.1 16.6 L19.8 24.6 L16 16.4 Z" fill="#d946ef" opacity="0.9"/>
    <!-- pavilion -->
    <path d="M12.2 24.6 L16 16.4 L19.8 24.6 Z" fill="#a78bfa" opacity="0.95"/>
    <!-- girdle -->
    <path d="M9.4 12.1 L22.6 12.1" fill="none" stroke="#f5f3ff" stroke-opacity="0.55" stroke-width="0.7"/>
  </g>
</svg>